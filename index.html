<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Scanner + Editor</title>
    <!-- OpenCV.js untuk deteksi otomatis -->
    <script src="https://docs.opencv.org/4.9.0/opencv.js">
    </script>
    <!-- jsPDF untuk export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app-container {
            max-width: 520px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a44;
        }
        h1 {
            text-align: center;
            color: #fff;
            font-weight: 600;
            font-size: 24px;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        h1 span {
            color: #6c63ff;
        }
        .status-text {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 18px;
            min-height: 20px;
        }
        .viewer-box {
            position: relative;
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
            touch-action: none;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #editorCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            background: #111;
        }
        .crop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .crop-box {
            position: absolute;
            border: 2px solid #6c63ff;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .crop-handle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #6c63ff;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: auto;
            cursor: grab;
            z-index: 10;
            transform: translate(-50%, -50%);
        }
        .crop-handle:active {
            cursor: grabbing;
        }
        .action-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 16px;
        }
        .btn {
            padding: 10px 0;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 12px;
            background: #2a2a44;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            border: 1px solid transparent;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-primary {
            background: #6c63ff;
            color: #fff;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
        }
        .btn-success {
            background: #2e7d32;
            color: #fff;
        }
        .btn-warning {
            background: #b76e1e;
            color: #fff;
        }
        .btn-danger {
            background: #b71c1c;
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #444;
        }
        .btn-icon {
            font-size: 18px;
            line-height: 1;
        }
        .btn-label {
            font-size: 9px;
            opacity: 0.9;
        }
        #fileInput {
            display: none;
        }
        .loader {
            display: none;
        }
        @media (max-width: 480px) {
            .app-container {
                padding: 12px;
                border-radius: 24px;
            }
            .action-grid {
                gap: 4px;
            }
            .btn {
                font-size: 10px;
                padding: 8px 0;
                border-radius: 10px;
            }
            .btn-icon {
                font-size: 16px;
            }
            .crop-handle {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>📄 <span>Fast</span> Scanner</h1>
        <div class="status-text" id="statusText">📷 Mengaktifkan kamera...</div>

        <div class="viewer-box" id="viewerBox">
            <video id="video" autoplay playsinline></video>
            <canvas id="editorCanvas"></canvas>
            <div class="crop-overlay" id="cropOverlay" style="display:none;">
                <div class="crop-box" id="cropBox">
                    <div class="crop-handle" data-dir="tl" style="top:0;left:0;"></div>
                    <div class="crop-handle" data-dir="tr" style="top:0;left:100%;"></div>
                    <div class="crop-handle" data-dir="br" style="top:100%;left:100%;"></div>
                    <div class="crop-handle" data-dir="bl" style="top:100%;left:0;"></div>
                    <div class="crop-handle" data-dir="top" style="top:0;left:50%;"></div>
                    <div class="crop-handle" data-dir="bottom" style="top:100%;left:50%;"></div>
                    <div class="crop-handle" data-dir="left" style="top:50%;left:0;"></div>
                    <div class="crop-handle" data-dir="right" style="top:50%;left:100%;"></div>
                </div>
            </div>
        </div>

        <div class="action-grid">
            <button class="btn btn-primary" id="btnCapture"><span class="btn-icon">📸</span><span class="btn-label">Ambil</span></button>
            <button class="btn btn-warning" id="btnUpload"><span class="btn-icon">🖼️</span><span class="btn-label">Upload</span></button>
            <button class="btn btn-success" id="btnCrop"><span class="btn-icon">✂️</span><span class="btn-label">Terapkan</span></button>
            <button class="btn btn-success" id="btnPDF"><span class="btn-icon">📑</span><span class="btn-label">PDF</span></button>
            <button class="btn btn-outline" id="btnJPG"><span class="btn-icon">🖼️</span><span class="btn-label">JPG</span></button>
        </div>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <script>
        // ================================================================
        // 1. ELEMEN & VARIABEL GLOBAL
        // ================================================================
        const video = document.getElementById('video');
        const editorCanvas = document.getElementById('editorCanvas');
        const ctx = editorCanvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const viewerBox = document.getElementById('viewerBox');
        const cropOverlay = document.getElementById('cropOverlay');
        const cropBox = document.getElementById('cropBox');

        let cvReady = false;
        let stream = null;
        let originalImage = null;
        let croppedImage = null;
        let cropRect = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
        let isDragging = false;
        let activeHandle = null;
        let startX, startY, startRect;

        // ================================================================
        // 2. OPENCV READY
        // ================================================================
        function onOpenCvReady() {
            cvReady = true;
            statusText.innerHTML = '✅ OpenCV siap (deteksi otomatis tersedia)';
        }
        if (typeof cv !== 'undefined' && cv.Mat) {
            onOpenCvReady();
        } else {
            window.onOpenCvReady = onOpenCvReady;
        }

        // ================================================================
        // 3. KAMERA
        // ================================================================
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                statusText.innerHTML = '📷 Kamera aktif. Arahkan ke dokumen, lalu tekan "Ambil"';
            } catch (err) {
                statusText.innerHTML = '⚠️ Gagal akses kamera: ' + err.message;
                console.warn(err);
            }
        }
        startCamera();

        // ================================================================
        // 4. DETEKSI OTOMATIS DENGAN OPENCV
        // ================================================================
        function autoDetectAndCrop(sourceCanvas) {
            if (!cvReady) {
                statusText.innerHTML = '⚠️ OpenCV belum siap, gunakan crop manual.';
                return null;
            }
            try {
                let src = cv.imread(sourceCanvas);
                let gray = new cv.Mat();
                let edges = new cv.Mat();
                let hierarchy = new cv.Mat();
                let contours = new cv.MatVector();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
                cv.Canny(gray, edges, 75, 200);
                cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                let maxArea = 0,
                    maxIdx = -1;
                for (let i = 0; i < contours.size(); i++) {
                    let area = cv.contourArea(contours.get(i));
                    if (area > maxArea) { maxArea = area;
                        maxIdx = i; }
                }
                if (maxIdx === -1 || maxArea < 5000) {
                    src.delete();
                    gray.delete();
                    edges.delete();
                    hierarchy.delete();
                    contours.delete();
                    return null;
                }
                let contour = contours.get(maxIdx);
                let approx = new cv.Mat();
                cv.approxPolyDP(contour, approx, 0.02 * cv.arcLength(contour, true), true);
                if (approx.rows() !== 4) {
                    approx.delete();
                    contour.delete();
                    src.delete();
                    gray.delete();
                    edges.delete();
                    hierarchy.delete();
                    contours.delete();
                    return null;
                }
                let pts = [];
                for (let i = 0; i < 4; i++) {
                    pts.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
                }
                let cx = pts.reduce((s, p) => s + p.x, 0) / 4;
                let cy = pts.reduce((s, p) => s + p.y, 0) / 4;
                pts.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));

                let srcPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    pts[0].x, pts[0].y, pts[1].x, pts[1].y,
                    pts[2].x, pts[2].y, pts[3].x, pts[3].y
                ]);
                let w1 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                let w2 = Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y);
                let h1 = Math.hypot(pts[0].x - pts[3].x, pts[0].y - pts[3].y);
                let h2 = Math.hypot(pts[1].x - pts[2].x, pts[1].y - pts[2].y);
                let maxW = Math.max(w1, w2, 200);
                let maxH = Math.max(h1, h2, 200);
                let dstPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    0, 0, maxW, 0, maxW, maxH, 0, maxH
                ]);
                let M = cv.getPerspectiveTransform(srcPoints, dstPoints);
                let warped = new cv.Mat();
                cv.warpPerspective(src, warped, M, new cv.Size(maxW, maxH));

                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = maxW;
                tempCanvas.height = maxH;
                cv.imshow(tempCanvas, warped);

                src.delete();
                gray.delete();
                edges.delete();
                hierarchy.delete();
                contours.delete();
                contour.delete();
                approx.delete();
                srcPoints.delete();
                dstPoints.delete();
                M.delete();
                warped.delete();

                return tempCanvas;
            } catch (e) {
                console.warn('Auto detect error:', e);
                return null;
            }
        }

        // ================================================================
        // 5. TANGKAP GAMBAR
        // ================================================================
        function captureImage() {
            if (!video.srcObject) {
                alert('Kamera belum aktif.');
                return;
            }
            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 1280;
            tempCanvas.height = video.videoHeight || 720;
            let tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

            let result = autoDetectAndCrop(tempCanvas);
            if (result) {
                originalImage = result;
                statusText.innerHTML = '✅ Deteksi berhasil! Silakan atur crop jika perlu.';
            } else {
                originalImage = tempCanvas;
                statusText.innerHTML = '⚠️ Deteksi gagal, gunakan crop manual.';
            }
            showEditor(originalImage);
        }

        // ================================================================
        // 6. TAMPILKAN EDITOR
        // ================================================================
        function showEditor(sourceCanvas) {
            video.style.display = 'none';
            editorCanvas.style.display = 'block';
            cropOverlay.style.display = 'block';

            let rect = viewerBox.getBoundingClientRect();
            let containerW = viewerBox.clientWidth;
            let containerH = viewerBox.clientHeight;
            let imgW = sourceCanvas.width;
            let imgH = sourceCanvas.height;
            let scale = Math.min(containerW / imgW, containerH / imgH);
            let displayW = imgW * scale;
            let displayH = imgH * scale;

            editorCanvas.width = imgW;
            editorCanvas.height = imgH;
            editorCanvas.style.width = displayW + 'px';
            editorCanvas.style.height = displayH + 'px';
            ctx.clearRect(0, 0, imgW, imgH);
            ctx.drawImage(sourceCanvas, 0, 0, imgW, imgH);

            originalImage = sourceCanvas;
            cropRect = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
            updateCropBox();
            statusText.innerHTML = '✂️ Atur bingkai crop, lalu tekan "Terapkan"';
        }

        // ================================================================
        // 7. UPDATE CROP BOX
        // ================================================================
        function updateCropBox() {
            let w = editorCanvas.width;
            let h = editorCanvas.height;
            let x = cropRect.x * w;
            let y = cropRect.y * h;
            let cw = cropRect.w * w;
            let ch = cropRect.h * h;

            if (x < 0) { x = 0;
                cropRect.x = 0; }
            if (y < 0) { y = 0;
                cropRect.y = 0; }
            if (x + cw > w) { cw = w - x;
                cropRect.w = cw / w; }
            if (y + ch > h) { ch = h - y;
                cropRect.h = ch / h; }

            cropBox.style.left = (cropRect.x * 100) + '%';
            cropBox.style.top = (cropRect.y * 100) + '%';
            cropBox.style.width = (cropRect.w * 100) + '%';
            cropBox.style.height = (cropRect.h * 100) + '%';
        }

        // ================================================================
        // 8. DRAG CROP HANDLE
        // ================================================================
        function setupCropDrag() {
            const handles = document.querySelectorAll('.crop-handle');

            function onStart(e) {
                e.preventDefault();
                let touch = e.touches ? e.touches[0] : e;
                activeHandle = e.currentTarget;
                let dir = activeHandle.dataset.dir;
                startX = touch.clientX;
                startY = touch.clientY;
                startRect = { ...cropRect };
                isDragging = true;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
            }

            function onMove(e) {
                if (!isDragging || !activeHandle) return;
                e.preventDefault();
                let touch = e.touches ? e.touches[0] : e;
                let dx = (touch.clientX - startX) / editorCanvas.width;
                let dy = (touch.clientY - startY) / editorCanvas.height;
                let dir = activeHandle.dataset.dir;
                let newRect = { ...startRect };

                if (dir.includes('l')) { newRect.x = startRect.x + dx;
                    newRect.w = startRect.w - dx; }
                if (dir.includes('r')) { newRect.w = startRect.w + dx; }
                if (dir.includes('t')) { newRect.y = startRect.y + dy;
                    newRect.h = startRect.h - dy; }
                if (dir.includes('b')) { newRect.h = startRect.h + dy; }

                if (newRect.w < 0.05) newRect.w = 0.05;
                if (newRect.h < 0.05) newRect.h = 0.05;
                if (newRect.x < 0) { newRect.w += newRect.x;
                    newRect.x = 0; }
                if (newRect.y < 0) { newRect.h += newRect.y;
                    newRect.y = 0; }
                if (newRect.x + newRect.w > 1) { newRect.w = 1 - newRect.x; }
                if (newRect.y + newRect.h > 1) { newRect.h = 1 - newRect.y; }

                cropRect = newRect;
                updateCropBox();
            }

            function onEnd() {
                isDragging = false;
                activeHandle = null;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }

            handles.forEach(h => {
                h.addEventListener('mousedown', onStart);
                h.addEventListener('touchstart', onStart, { passive: false });
            });
        }
        setupCropDrag();

        // ================================================================
        // 9. TERAPKAN CROP
        // ================================================================
        function applyCrop() {
            if (!originalImage) {
                alert('Tidak ada gambar untuk di-crop.');
                return;
            }
            let w = originalImage.width;
            let h = originalImage.height;
            let x = Math.round(cropRect.x * w);
            let y = Math.round(cropRect.y * h);
            let cw = Math.round(cropRect.w * w);
            let ch = Math.round(cropRect.h * h);

            let cropCanvas = document.createElement('canvas');
            cropCanvas.width = cw;
            cropCanvas.height = ch;
            let cropCtx = cropCanvas.getContext('2d');
            cropCtx.drawImage(originalImage, x, y, cw, ch, 0, 0, cw, ch);

            originalImage = cropCanvas;
            editorCanvas.width = cw;
            editorCanvas.height = ch;
            ctx.drawImage(cropCanvas, 0, 0);
            cropRect = { x: 0, y: 0, w: 1, h: 1 };
            updateCropBox();
            statusText.innerHTML = '✅ Crop diterapkan! Simpan sebagai PDF/JPG.';
            croppedImage = cropCanvas;
        }

        // ================================================================
        // 10. TOMBOL
        // ================================================================
        document.getElementById('btnCapture').addEventListener('click', captureImage);

        document.getElementById('btnUpload').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    let tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    let tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    let result = autoDetectAndCrop(tempCanvas);
                    if (result) {
                        originalImage = result;
                    } else {
                        originalImage = tempCanvas;
                        statusText.innerHTML = '⚠️ Deteksi gagal, gunakan crop manual.';
                    }
                    showEditor(originalImage);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        document.getElementById('btnCrop').addEventListener('click', applyCrop);

        document.getElementById('btnJPG').addEventListener('click', function() {
            if (!originalImage) { alert('Silakan ambil atau upload gambar dulu!'); return; }
            let src = croppedImage || originalImage;
            const link = document.createElement('a');
            link.download = 'scanned_document.jpg';
            link.href = src.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        document.getElementById('btnPDF').addEventListener('click', function() {
            if (!originalImage) { alert('Silakan ambil atau upload gambar dulu!'); return; }
            let src = croppedImage || originalImage;
            try {
                const { jsPDF } = window.jspdf;
                const imgData = src.toDataURL('image/jpeg', 0.90);
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfW = 210,
                    pdfH = 297;
                const imgW = src.width,
                    imgH = src.height;
                const ratio = Math.min(pdfW / imgW, pdfH / imgH);
                const fw = imgW * ratio,
                    fh = imgH * ratio;
                const x = (pdfW - fw) / 2,
                    y = (pdfH - fh) / 2;
                pdf.addImage(imgData, 'JPEG', x, y, fw, fh);
                pdf.save('scanned_document.pdf');
                statusText.innerHTML = '✅ PDF berhasil diunduh!';
            } catch (err) {
                alert('Gagal buat PDF: ' + err.message);
            }
        });

        // Update crop box awal
        setTimeout(() => updateCropBox(), 500);
        console.log('🚀 Fast Scanner + Editor siap!');
    </script>
</body>
</html>
